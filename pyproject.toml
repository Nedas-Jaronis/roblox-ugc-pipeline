[project]
name = "robloxchars"
version = "0.1.0"
description = "Local pipeline for generating, validating, and preparing Roblox UGC characters and accessories"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.optional-dependencies]
gen = [
    "gradio-client>=1.3",  # call HF Spaces for cube3d / InstantMesh / TripoSR
    "Pillow>=10.0",        # texture-size validation, optional image preprocessing
    "rembg>=2.0",          # background removal for image-to-3D inputs
    "huggingface-hub>=0.24",
]

[project.scripts]
robloxchars = "robloxchars.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"robloxchars.blender" = ["*.py"]
